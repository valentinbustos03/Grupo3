# Tema dark "fintech" — evita el look default de Streamlit.
# El CSS fino (badges, KPI cards) se inyecta desde el dashboard.
[theme]
base = "dark"
primaryColor = "#22c55e"            # verde acento (ganó)
backgroundColor = "#0b0f14"         # fondo casi negro
secondaryBackgroundColor = "#141a21" # cards / sidebar
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
